# Musique fold-0 ablation: probe_fraction 0.2 → 0.4.
# Compare WARP@40% against Random-region / Frequency-only / Gain-only.
# No KET/G2ConS, no BM25/Dense/Hybrid/Full Graph/HippoRAG2 test eval,
# no partition-mode ablations, no IRCoT. Reader stays WARP-only
# (same as the paper reader table). Reuse outputs/indexes/musique.
dataset:
  name: musique
  corpus: data/processed/musique/corpus.jsonl
  queries: data/processed/musique/queries.jsonl
warp:
  retrieval_k: 10
  candidate_k: 50
  routing_k: 20
  coaccess_k: 20
  semantic_k: 5
  semantic_lambda: 0.05
  probe_fraction: 0.4
  probe_max_queries: 64
  gain_prior_queries: 16.0
  benefit_objective: mixed
  complete_weight: 0.5
  selection_mode: conditional
  conditional_max_queries: 32
  conditional_candidates: 6
  conditional_pairs: 6
  conditional_rounds: 3
  conditional_max_evaluations: 16
  retrieval_steps: 2
  feedback_docs: 2
  feedback_chars: 400
  dispersion_pairs: 4096
  interaction_pairs: 0
  partition_mode: combined
  min_region_size: 5
  seed: 42
  retrieval_ks: [2, 3, 5, 10]
  multistep_max_steps: 3
graph:
  artifact_root: outputs/indexes/musique
  llm_name: deepseek-v4-flash
  disable_llm_thinking: true
  embedding_model_name: nvidia/NV-Embed-v2
  embedding_batch_size: 8
  retrieval_top_k: 200
  linking_top_k: 5
  qa_top_k: 5
  damping: 0.5
  passage_node_weight: 0.05
  synonymy_edge_topk: 2047
  synonymy_edge_sim_threshold: 0.8
  graph_type: facts_and_sim_passage_node_unidirectional
  input_usd_per_million_tokens: 0.15
  output_usd_per_million_tokens: 0.60
reranker:
  model_name: BAAI/bge-reranker-v2-m3
  revision: b5160aeac3c6c8fe7beaaaf04c9e0142826b58d1
  batch_size: 32
  max_length: 512
experiment:
  cross_fitting_folds: 5
  methods:
  - warp
  - random_region
  - frequency_only
  - gain_only
  ket_core_fraction: 0.8
  g2_core_fraction: 0.8
  seed: 42
  randomization_samples: 10000
  base_retrievers: []
  graph_baselines: []
  partition_ablations:
    modes: []
    seed: 42
reader:
  enabled: true
  top_k: 5
  repeats: 3
  methods:
  - warp
